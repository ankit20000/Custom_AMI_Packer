name: Packer Validate

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ami-Creation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Initialize plugins
        run: packer init .

      - name: Check formatting
        run: packer fmt -check .

      - name: Validate dev template
        run: packer validate -var-file=variables.pkrvars.hcl .

      - name: Validate QA template
        run: packer validate -var-file=qavariables.pkrvars.hcl .
